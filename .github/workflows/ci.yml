# Continuous integration for Dev Wrapped.
#
# Every push and pull request runs the full quality gate on the three desktop
# platforms: install from the lockfile, lint, type check, unit tests, security
# scans, dependency audit and — on Linux — a real VSIX build that is uploaded
# as an artifact. The job fails if any step fails, so a release can never be
# built from a commit that was not verified.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20.x', '22.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies (from the lockfile, no scripts)
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Webview render smoke test
        run: npm run test:webview

      - name: Secret scan
        run: npm run security:scan

      - name: Dependency audit
        run: npm run audit
        continue-on-error: false

      - name: Package (Linux only, uploaded once)
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22.x'
        run: mkdir -p dist && npx --yes @vscode/vsce@3 package --no-dependencies --out dist/dev-wrapped-${{ github.sha }}.vsix

      - name: Security checklist (Linux only)
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22.x'
        run: npm run security:check

      - name: Upload the VSIX artifact
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: dev-wrapped-vsix
          path: dist/*.vsix
          if-no-files-found: error
          retention-days: 14
